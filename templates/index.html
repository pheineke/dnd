<!-- Basic flask website with threejs -->
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threejs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/canvas.css') }}">
    <!-- importmap -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three",
                "three/addons/": "https://esm.sh/three/examples/jsm/",
                "socket.io-client": "https://esm.sh/socket.io-client@4.8.1"
            }
        }
    </script>
</head>
<body>
    <!-- <canvas id="canvas"></canvas> -->

    <canvas id="canvas"></canvas>
    <div class="add_figure">
        <form id="add_figure_form">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name">
            <label for="size">Size:</label>
            <input type="number" name="size" id="size" min="1" max="4" step="1">
            <label for="color">Color:</label>
            <input type="color" name="color" id="color">
            <button type="submit">Add figure</button>
        </form>
    </div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/input.js')}}"></script>
</body>
</html>
